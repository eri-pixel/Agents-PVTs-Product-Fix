<style>
/* Layout: one centred column; home = flyer-style tile grid, then one card per step */
:root{--agent:#d9466f;--pvt:#2f6fd0;--bg:#faf7f2;--card:#ffffff;--ink:#22212b;--muted:#6b6875;--line:#e6e0d8;--accent:#d9466f;--accent-ink:#fff;--ok:#2d7a4d;--ok-soft:#e2f2e7;--chg:#9a5b0a;--chg-soft:#fcefd8;--tbc:#8a8794;

--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161c;--card:#211f28;--ink:#efedf2;--muted:#a7a3b0;--line:#34313d;--accent:#f27399;--accent-ink:#1b0c12;--ok:#72c995;--ok-soft:#1d3326;--chg:#f0b45e;--chg-soft:#392b16;--tbc:#8f8b99;--agent:#f27399;--pvt:#7aa8f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17161c;--card:#211f28;--ink:#efedf2;--muted:#a7a3b0;--line:#34313d;--accent:#f27399;--accent-ink:#1b0c12;--ok:#72c995;--ok-soft:#1d3326;--chg:#f0b45e;--chg-soft:#392b16;--tbc:#8f8b99;--agent:#f27399;--pvt:#7aa8f5;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:880px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800}
h2{font-size:clamp(1.3rem,4.5vw,1.7rem);font-weight:800}
.muted{color:var(--muted)}.small{font-size:.86rem}
.btn{font:600 .95rem var(--body);border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font:800 1.1rem var(--display);padding:14px 28px;border-radius:999px}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok.on{background:var(--ok);color:var(--card)}
.btn.small{padding:6px 11px;font-size:.84rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:90px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{text-align:center;display:grid;gap:10px;justify-items:center;margin-bottom:22px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;width:100%;max-width:420px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:0;border-radius:16px;padding:16px 12px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;color:#1d1b22;font:800 1.05rem/1.15 var(--display)}
.tile small{font:600 .78rem var(--body);opacity:.85}
.tile .st{align-self:flex-start;background:rgb(255 255 255/.75);border-radius:999px;padding:2px 9px;font:700 .72rem var(--body)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chip{font:700 .8rem var(--body);padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.steps{display:flex;gap:4px;margin:0 0 16px}
.steps span{flex:1;height:7px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--accent)}
.pick{display:grid;gap:8px;margin-top:14px}
.pick .btn{text-align:left;display:flex;justify-content:space-between;gap:10px;padding:14px 16px}
.pick .btn.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.f{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:8px}
.f:first-of-type{border-top:0}
.fl{font-weight:700;font-size:.92rem}
.fv{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:9px 12px}
.fv.tbc{color:var(--tbc);font-style:italic}
.tag{font:700 .72rem var(--body);padding:2px 8px;border-radius:999px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.chg{background:var(--chg-soft);color:var(--chg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;background:var(--card);z-index:2}
.f.need{border:2px solid var(--accent);border-radius:14px;padding:14px;margin:10px 0;background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.tag.need{background:var(--accent);color:var(--accent-ink)}
.f.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.f.flash{animation:none}}
.missbtn{border-color:var(--accent);color:var(--accent);font-weight:700}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))!important;max-width:calc(100% - 32px);text-align:center}
@media (max-width:600px){.foot .missbtn{flex-basis:100%;order:-1}}
.btn.primary.dim{opacity:.55}
.tile small{display:inline-block;margin-top:4px;background:rgb(255 255 255/.75);border-radius:999px;padding:1px 8px;font:700 .72rem var(--body)}
.saving{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 .8rem var(--body);color:var(--muted);z-index:9}
.btn.tog{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:12px 0}
.btn.tog .box{width:22px;height:22px;flex:none;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-weight:800;color:var(--card)}
.btn.tog.on{border-color:var(--accent)}.btn.tog.on .box{background:var(--accent);border-color:var(--accent)}
.btn.danger{color:#b4232c;border-color:transparent;background:none}
.btn.dangerfill{background:#b4232c;border-color:#b4232c;color:#fff}
.confirm{border:2px solid #b4232c;border-radius:14px;padding:14px;margin-bottom:14px;display:grid;gap:8px;background:var(--card)}
input,textarea{font-size:16px}
.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (min-width:900px){.card{padding:28px 32px}.tiles{gap:14px}.tile{min-height:130px;font-size:1.15rem}}
@media (max-width:600px){
 .wrap{padding-block:14px 30px}

 .choices .btn{flex:1 1 calc(50% - 8px);text-align:center}
 .btn.big{width:100%}
 .foot .btn{flex:1}
 .foot .small{width:100%;text-align:center;order:-1}
 .pick .btn{padding:12px 13px}
 .tile{min-height:96px;font-size:.98rem}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9}

.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line)}
</style>

const SUG={"Silent Disco": {"11": ["Our most popular experience! Every child gets their own wireless headphones and a glow stick, and a Disco Kids host leads them through dance games, easy routines and party challenges. The music is immersive, the energy is high, and everyone can join in and have fun.", "Silent Disco is a hosted dance party with a twist: every child dances to the music through their own wireless headphones. Our facilitator guides games, routines and group challenges, keeping the energy high and the room calm. Glow sticks for everyone make it feel like a real party."], "12": ["Silent Disco is the Disco Kids experience children ask for again and again. Every child wears their own wireless headphones, so they're fully immersed in the music while the room stays calm and focused. A Disco Kids facilitator hosts the whole session, leading dance games, easy-to-follow routines and group challenges designed to get every child moving. Glow sticks for all add to the party feel. Because the music and instructions come straight through each child's headphones, quieter children feel comfortable joining in and confident dancers can shine. It's high-energy, inclusive fun built on years of hosting these sessions. All headphones and equipment are provided.", "Turn any space into a dance party with Disco Kids Silent Disco. Each child receives wireless headphones and a glow stick, then our facilitator takes them through music games, simple routines and group dance challenges. The headphones carry both the music and the host's voice, which keeps instructions clear, transitions smooth and every child tuned in. Kids explore rhythm, express themselves and connect with friends in a session that's energetic without being loud. It suits mixed ages and abilities, and it works indoors in halls, classrooms and community spaces. We bring all the headphones and equipment, so you just provide the space."], "13": ["Put on wireless headphones, grab a glow stick, and dance through games, routines and group challenges led by the host.", "Dance to music through their own headphones, follow easy routines, and join music games and group dance challenges."], "14": ["Wireless headphones for every child · Glow sticks for all · Facilitator-hosted session · Dance games and routines · Group challenges", "Immersive music through individual headsets · Clear host instructions · Easy-to-follow routines · Party games · All equipment provided"], "15": ["Gets kids active, builds confidence and coordination, and encourages connection with friends in an inclusive, low-noise setting.", "Kids stay engaged and moving, quieter children feel comfortable joining in, and everyone builds teamwork and self-expression."], "16": ["Every child has their own headphones, so the music and instructions are clear and immersive while the room stays calm.", "A real dance party without the noise, hosted by an experienced facilitator who keeps every child involved."], "10": ["A hosted silent disco dance party where every child dances to the music through their own wireless headphones.", "An immersive headphone dance party with games, routines and glow sticks, led by a Disco Kids facilitator."]}, "Silent Circus": {"11": ["Step into the world of circus with a silent twist! Using wireless headphones, kids are fully immersed as a Disco Kids facilitator guides them through circus skills, games and challenges. It's playful, focused and full of fun.", "Circus skills meet headphone technology. Each child wears their own headset as our host guides them step by step through circus games and activities, helping them try new skills, keep practising and celebrate their progress."], "12": ["Silent Circus combines circus skills with the immersive feel of wireless headphones. Every child hears the music and the facilitator's guidance clearly through their own headset, creating a calm, focused space for learning. A Disco Kids facilitator leads guided circus games and activities, teaching skills step by step with plenty of encouragement. Children practise together, try new challenges and cheer each other on. The headphones keep focus high and noise low, so every child can stay engaged. It's playful and challenging in the best way, and all circus equipment and headsets are provided.", "Step into the magical world of circus with Disco Kids Silent Circus. Wearing wireless headphones, kids are guided through circus skills and games by an experienced facilitator, with music and instructions coming straight to each child. The session moves smoothly from skill to skill, giving everyone time to practise, improve and show what they've learned. Children build coordination, focus and confidence as they try something new together. It suits mixed ages and abilities, and we bring all the circus equipment and headphones needed."], "13": ["Wear wireless headphones and learn circus skills through guided games and activities with the host.", "Try circus equipment, practise new tricks step by step, and join circus games while listening through their own headset."], "14": ["Circus equipment provided · Headphones for every child · Experienced facilitator · Guided circus games and activities", "Immersive music and clear instructions · Step-by-step circus skills · Group challenges · Suits mixed abilities"], "15": ["Builds confidence, focus and persistence as kids learn new skills and keep trying.", "Develops coordination and concentration, and encourages kids to support each other's progress."], "16": ["Headphones make circus learning immersive and focused, a unique twist on a circus workshop.", "Combines two kid favourites, circus and silent disco, in one facilitated session."], "10": ["Circus skills and games with a silent twist, guided through wireless headphones by a Disco Kids facilitator.", "An immersive headphone circus experience where kids learn and practise circus skills together."]}, "Time Warp": {"11": ["All aboard the musical time machine! Using wireless headphones, kids travel through the decades, learning iconic dance crazes and moving to hit songs through games, challenges and plenty of laughs.", "Time Warp takes kids on a high-energy journey through music history. Through their own headphones, they learn famous dance moves from different eras and join partner, group and movement games led by our host."], "12": ["Jump into the Disco Kids Time Warp, a musical time machine for kids. Every child wears wireless headphones and follows our facilitator from one decade to the next, learning signature dance moves and grooving to hit songs from each era. Partner activities, group dances and movement games keep everyone involved and laughing. The headphones make the experience fully immersive, so every child is tuned in to the music and the host. Kids discover songs their parents and grandparents loved while building rhythm, coordination and confidence. It's inclusive, beginner friendly and full of energy, and all headphones and equipment are provided.", "Time Warp is a decade-hopping dance adventure. With wireless headphones on, kids are guided through iconic dance crazes and musical hits from across the decades by an experienced Disco Kids facilitator. Each era brings a new move, a new game or a new challenge, with partner and group activities that get everyone moving together. The music and instructions come straight through each child's headset, keeping transitions smooth and participation high. It's fun, energetic and easy for every child to join in, whatever their dance experience."], "13": ["Wear wireless headphones and learn dance moves from different decades, with partner, group and movement games.", "Travel through musical eras, learn iconic dance crazes and join interactive dance games with the group."], "14": ["Headphones for every child · Dance moves from multiple decades · Partner and group activities · Interactive movement games", "Iconic songs and dance crazes · Experienced facilitator · Immersive headsets · Beginner friendly"], "15": ["Builds rhythm, coordination and confidence, and connects kids with music across generations.", "Encourages teamwork through partner and group dances, and keeps every child active and laughing."], "16": ["A musical time machine: kids experience decades of dance crazes in one immersive headphone session.", "Combines music history with headphone technology, giving kids a fun way to discover songs from other eras."], "10": ["A musical time machine: kids dance through the decades with wireless headphones, games and iconic moves.", "A decade-hopping headphone dance adventure through iconic songs and dance crazes."]}, "Silent Line Dancing": {"11": ["Stomp, clap, spin and have fun! With wireless headphones on, kids learn easy-to-follow line dances inspired by today's biggest dance trends, guided step by step by a Disco Kids facilitator.", "Line dancing is trending with kids right now, and our headphone version makes it even easier to follow. Every child hears the music and the host's cues clearly as they learn popular routines and dance together as a group."], "12": ["Stomp, clap, spin and have fun with Disco Kids Silent Line Dancing. Every child wears wireless headphones, so the music and the facilitator's step-by-step cues come through loud and clear, even in a busy space. Kids learn easy-to-follow line dances inspired by today's biggest dance trends, with interactive games and activities between routines to keep the energy high. Line dancing is naturally inclusive because everyone dances together, side by side, and no partner is needed. Children build confidence, coordination and teamwork while getting active. It's beginner friendly, and all headphones and equipment are provided.", "Silent Line Dancing brings the line dancing craze to kids with a headphone twist. A Disco Kids facilitator teaches popular routines one step at a time, with every cue coming straight through each child's headset. That means clear instructions, smooth transitions and a whole group dancing in sync. Interactive games keep everyone engaged, and the beginner-friendly routines mean every child can succeed. Dancing together builds a real sense of teamwork and belonging, while learning the steps improves memory, rhythm and coordination."], "13": ["Wear wireless headphones, learn popular line dances step by step, and dance together as a whole group.", "Stomp, clap and spin through trending routines, play dance games, then perform the dances together."], "14": ["Headphones for every child · Popular line dances · Step-by-step cues · Interactive games · No partner needed", "Trending routines kids recognise · Clear instructions through headsets · Whole-group dancing · Beginner friendly"], "15": ["Builds confidence, coordination, rhythm and teamwork, and gets the whole group moving together.", "Improves memory and coordination, creates a sense of belonging, and keeps kids active in an inclusive way."], "16": ["Headphones carry every cue straight to each child, so even big groups can learn and dance in sync.", "It taps into a dance trend kids already love, and everyone dances together, so no one is left out."], "10": ["Trending line dances taught step by step through wireless headphones, so every child can follow along.", "A headphone line dancing session where kids learn popular routines and dance together as a group."]}, "Silent Mindful Art & Movement": {"11": ["Focus, create and move! A calm, creative blend of mindful art and gentle movement. Through their own wireless headphones, kids follow guided activities that encourage focus, creativity and self-expression.", "Silent Mindful Art & Movement gives kids a calm, creative space. With headphones on, they tune in to relaxing music and our facilitator's guidance as they create art and move in gentle, joyful ways."], "12": ["Silent Mindful Art & Movement blends mindful art, gentle movement, creativity and relaxation into one immersive experience. Every child wears wireless headphones, so they can tune in to calming music and the facilitator's guidance without distractions. Kids explore guided art activities, express themselves creatively and move through relaxing, joyful movement sequences. There's no right or wrong, so every child feels comfortable taking part. It's a lovely balance to high-energy activities and suits a wide range of ages and abilities. All headphones and art materials are provided.", "Create, breathe and move with Disco Kids Silent Mindful Art & Movement. Through their own headphones, children are guided by an experienced facilitator through creative art activities and gentle movement, set to calming music. The headphones create a peaceful, focused atmosphere, helping kids slow down and enjoy the moment. They leave proud of their creations and feeling relaxed. It works beautifully indoors, and we bring all the headphones and art materials needed."], "13": ["Wear wireless headphones and follow guided art activities, then move through calm, joyful movement.", "Create art while listening to calming music, try gentle movement, and express themselves creatively."], "14": ["Headphones for every child · Guided art activities · Gentle movement · Creativity and self-expression", "Calming music · Art materials provided · Experienced facilitator · Suits all ages and abilities"], "15": ["Gives kids a calm, creative break, and encourages focus and self-expression.", "Encourages creativity and gives kids a chance to slow down, relax and refocus."], "16": ["Combines art and movement with headphone technology, creating a calm, focused space anywhere.", "A rare calm, creative experience that balances out high-energy programs."], "10": ["A calm, creative blend of guided art and gentle movement, experienced through wireless headphones.", "Mindful art and movement with headphones, giving kids a calm, focused space to create and move."]}, "Silent Disco Walks / Excursions": {"11": ["Take the party on the move! On a Silent Disco Walk, kids wear wireless headphones and follow our host on a musical adventure, dancing, singing and playing games along the way.", "A moving dance party! Our host leads the group on a silent disco walk, with music and instructions coming straight through every child's headphones. It's active, immersive and great fun."], "12": ["Take the dance party on the move with a Disco Kids Silent Disco Walk. Every child wears wireless headphones as a facilitator leads the group on a musical adventure, with dance stops, sing-alongs and movement games along the route. The headphones carry both the music and the host's voice, so instructions stay clear and the group stays together and engaged as they move between spaces. It's active, joyful and a little bit cheeky, as kids dance their way past onlookers. Walks and excursions are planned to suit the location, and all headphones and equipment are provided.", "Silent Disco Walks turn a walk into an adventure. With wireless headphones on, kids follow a Disco Kids host through a route filled with music, dance moves and fun challenges. Because every child hears the host directly, transitions are smooth and the group moves together safely and happily. It's a great way to get kids active, explore a space and share a memorable experience. Each walk is planned around the venue and group, and we bring all the headphones and equipment."], "13": ["Wear wireless headphones and follow the host on a walk, stopping to dance, sing and play movement games.", "Dance their way along a route, join music challenges at each stop, and move as a group guided by the host."], "14": ["Headphones for every child · Host-led route · Dance stops and sing-alongs · Movement games", "Music and host voice through every headset · Planned around the venue · All equipment provided"], "15": ["Gets kids active and exploring, builds group connection, and creates a memorable shared experience.", "Keeps groups engaged and together while moving, and gets kids active in a fun, social way."], "16": ["The party moves! Headphones let the host guide the group clearly while kids dance through different spaces.", "Combines a walk, a dance party and a group adventure in one facilitated experience."], "10": ["A moving silent disco: kids follow a host on a musical walk, dancing and playing games along the way.", "A host-led headphone dance adventure that takes the party on the move."]}, "LED Hula Hoops": {"11": ["Light it up! Kids learn hula hoop skills and tricks with glowing LED hoops, guided step by step by a Disco Kids facilitator, with music, games and friendly challenges.", "LED Hula Hoops brings a classic playground favourite to life with light. Kids learn to keep the hoop spinning, try simple tricks and show off their moves with glowing hoops and music."], "12": ["Light up the room with Disco Kids LED Hula Hoops. A facilitator teaches hoop skills step by step, starting with the basics and building up to arm spins, tosses and simple tricks. The glowing LED hoops make every move look spectacular, and music keeps the energy high. Games and friendly challenges give every child a chance to practise, improve and show off their new skills. It's beginner friendly and designed so children of different ages and abilities can all succeed. All hoops and equipment are provided. Available by request.", "LED Hula Hoops combines a timeless favourite with glowing hoops and music. An experienced Disco Kids facilitator guides kids through hoop skills and tricks suited to their level, with plenty of encouragement along the way. Children work at their own pace, celebrate small wins and cheer each other on. It's active, joyful and great for coordination and persistence. We bring all the LED hoops and equipment. Available by request, subject to facilitator availability."], "13": ["Learn to hula hoop with glowing LED hoops, try arm spins and simple tricks, and join hoop games to music.", "Practise hoop skills with a facilitator, play hoop games and show off new tricks in friendly challenges."], "14": ["LED hoops for every child · Experienced facilitator · Step-by-step tricks · Music and hoop games", "Glowing hoops · Skill-building at each child's pace · Fun challenges · Suits all abilities"], "15": ["Builds coordination, balance and persistence, and boosts confidence as kids master new tricks.", "Kids develop movement skills and focus, learn to keep trying, and celebrate their progress."], "16": ["Glowing LED hoops make every trick look amazing, so kids feel proud of every move.", "A classic playground activity turned into a glowing, music-filled experience."], "10": ["Hula hoop skills and tricks with glowing LED hoops, music and games. Available by request.", "A glowing LED hula hoop session where kids learn tricks step by step. Available by request."]}, "Bubbles & Slime Workshop": {"11": ["Welcome to the Bubbles & Slime Workshop! Kids explore the science and fun of bubbles, from making bubble slime to creating giant bubbles, in a hands-on session led by a Disco Kids facilitator.", "Bubbles bring instant smiles. In our Bubbles & Slime Workshop, kids experiment with bubble making, explore bubble science and play bubble games in a hands-on, playful session."], "12": ["Step into the Disco Kids Bubbles & Slime Workshop, where science meets play. A facilitator guides kids through hands-on bubble experiments, from making their own bubble slime to exploring how bubbles form, stretch and pop. Kids try different bubble tools, create bubbles of all sizes and join in fun challenges. It's a sensory, curious and joyful experience that sparks questions and wonder. The workshop suits a wide range of ages, and all materials and equipment are provided. Available by request.", "The Bubbles & Slime Workshop turns bubbles into a hands-on adventure. Led by a Disco Kids facilitator, children explore bubble science, make bubble slime and experiment with different bubble tools. Every child gets their hands involved, taking turns, sharing discoveries and having fun together. It's playful       :t[k]?`<div><button class="btn small" data-a="predit" data-k="${k}">Change</button></div>`
      :`<div class="fv">${def}</div><div class="row"><button class="btn ok small" data-a="prok" data-k="${k}" data-v="${def}">✓ Correct</button><button class="btn small" data-a="predit" data-k="${k}">Change</button></div>`}</div>`;
    body=`<div class="small muted">Agents only. This is different from PVT pricing.</div>${tier("a","1.5 hours","$475")}${tier("b","2 hours","")}${tier("c","3 hours","")}`;
  }
  const xn=c===0&&xs(cur.i).length?`<div class="small muted">In Xero it's called: ${esc(xs(cur.i).map(id=>DATA.xero[id][0]).join(", "))}</div>`:"";
  const hint=xn+(spec.hint?(DATA.progs[cur.i].loc?`<div class="small muted">Meeting brief: ${esc(DATA.progs[cur.i].loc)}</div>`:DATA.progs[cur.i].req?`<div class="small muted">Meeting brief: by request only</div>`:""):"");
  return `<div class="f ${done?"":"need"}" id="f-${c}">${head}${hint}${body}</div>`;
}
function donePage(){const p=DATA.progs[cur.i];const next=DATA.progs.findIndex((q,i)=>!prog(i).done);setTimeout(confetti,60);
  return `${header()}<div class="card" style="text-align:center;display:grid;gap:10px;justify-items:center"><div class="eyebrow">Program done</div><h2>${esc(p.name)} ✓</h2>
   <p class="muted" style="margin:0">All details filled in. Thank you! You can come back and change anything later. Just tap this program on the front page.</p>
   <div class="row" style="justify-content:center"><button class="btn" data-a="back">← Back</button>${next>=0?`<button class="btn primary big" data-a="open" data-i="${next}">Next: ${esc(DATA.progs[next].name)} ▶</button>`:`<button class="btn primary big" data-a="excel">Download Excel</button>`}<button class="btn" data-a="home">All programs</button></div></div>`}

let busy=false;
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-a]");if(!t||t.disabled||busy)return;const a=t.dataset.a,c=+t.dataset.c;busy=true;
  try{await act(a,t,c)}finally{busy=false}
});
function showMissing(){const els=[...document.querySelectorAll(".f.need")];if(!els.length)return;
  els.forEach(el=>{el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")});
  els[0].scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
  toast(els.length===1?"1 item still needs an answer. It's highlighted in pink.":`${els.length} items still need an answer. They're highlighted in pink.`)}
async function act(a,t,c){
  if(a==="multitog"){multi=!multi;pickSet=multi?xs(cur.i).slice():[];render();return}
  if(a==="resetask"){confirmReset=true;render();window.scrollTo(0,0);return}
  if(a==="resetno"){confirmReset=false;render();return}
  if(a==="resetyes"){confirmReset=false;editing=null;multi=false;pickSet=[];await save(cur.i,{},true);cur.step="xero";render();window.scrollTo(0,0);toast(DATA.progs[cur.i].name+" has been reset");return}
  const keep=window.scrollY;const done=()=>{render();window.scrollTo(0,keep)};const top=()=>{render();window.scrollTo(0,0)};
  if(a==="home"){cur=null;editing=null;confirmReset=false;return top()}
  if(a==="open"){const i=+t.dataset.i;cur={i,step:prog(i).xero===undefined?"xero":0};editing=null;pickSet=xs(i).slice();multi=pickSet.length>1;return top()}
  if(a==="xero"){const v=t.dataset.v||null;if(multi){pickSet=pickSet.includes(v)?pickSet.filter(x=>x!==v):[...pickSet,v];return done()}
    const same=xs(cur.i).length===(v?1:0)&&(v?xs(cur.i)[0]===v:prog(cur.i).xero===null);if(!same)await save(cur.i,{xero:v,xs:v?[v]:[],f:{}});cur.step=0;return top()}
  if(a==="xmulti"){const old=xs(cur.i).join();if(old!==pickSet.join())await save(cur.i,{xero:pickSet[0],xs:pickSet,f:{}});cur.step=0;return top()}
  if(a==="savecom"){const v=document.getElementById("com").value.trim();await save(cur.i,{com:{...(prog(cur.i).com||{}),[t.dataset.k]:v}});toast(v?"Comment saved":"Comment cleared");return done()}
  if(a==="ok"){await setAns(c,{v:wb(cur.i,c)});return done()}
  if(a==="edit"){editing=c;done();setTimeout(()=>document.getElementById("ed")?.focus(),0);return}
  if(a==="canced"){editing=null;return done()}
  if(a==="saveed"||a==="saveown"){const v=document.getElementById("ed").value.trim();if(!v)return toast("Type an answer, or press Cancel");editing=null;await setAns(c,{v});return done()}
  if(a==="single"){await setAns(c,{v:t.dataset.v});return done()}
  if(a==="multi"){const cur0=ans(cur.i,c)?.v;let have=cur0?cur0.split(/\s*,\s*/):[];const v=t.dataset.v;have=have.includes(v)?have.filter(x=>x!==v):[...have,v];await setAns(c,{v:have.join(", ")});return done()}
  if(a==="oth"){const v=document.getElementById("oth-"+c).value.trim();if(!v)return toast("Type something first");const spec=F[c];
    if(spec.t==="single"){await setAns(c,{v})}else{const have=(ans(cur.i,c)?.v||"").split(/\s*,\s*/).filter(x=>x&&spec.o.includes(x));await setAns(c,{v:[...have,v].join(", ")})}return done()}
  if(a==="sug"){await setAns(c,{v:SUG[DATA.progs[cur.i].name][c][+t.dataset.k]});editing=null;return done()}
  if(a==="savetxt"){const v=document.getElementById("ed-"+c).value.trim();if(!v)return toast("Type an answer, or tap a quick option");editing=null;await setAns(c,{v});return done()}
  if(a==="quick"){editing=null;await setAns(c,{v:t.dataset.v});return done()}
  if(a==="same"){editing=null;await setAns(c,{v:ans(prevIdx(),c).v,same:1});return done()}
  if(a==="sameall"){const p=prevIdx();const f={...(prog(cur.i).f||{})};PAGES[4][1].forEach(k=>{const pv=ans(p,k);if(pv&&!f["c"+k])f["c"+k]={v:pv.v,same:1,was:wb(cur.i,k),by:"Amanda",at:today()}});editing=null;await save(cur.i,{f});toast("Copied from "+DATA.progs[p].name+". Check anything that's different.");return done()}
  if(a.startsWith("pr")){const k=t.dataset.k;const tt={...(ans(cur.i,21)?.t||{})};
    if(a==="predit"){editing="p"+k;return done()}
    if(a==="prok")tt[k]=t.dataset.v;
    if(a==="prnone")tt[k]="Not offered";
    if(a==="prsave"){let v=document.getElementById("pr-"+k).value.trim().replace(/^\$/,"");if(!/^\d+(\.\d{1,2})?$/.test(v))return toast("Enter a number, e.g. 550");tt[k]="$"+v}
    editing=null;await setAns(21,{t:tt,v:`1.5hrs ${tt.d||"?"} · 2hrs ${tt.e||"?"} · 3hrs ${tt.f||"?"}`,agent:`1.5hrs ${tt.a||"?"} · 2hrs ${tt.b||"?"} · 3hrs ${tt.c||"?"}`});return done()}
  if(a==="back"){editing=null;pickSet=xs(cur.i).slice();multi=pickSet.length>1;if(cur.step==="done")cur.step=PAGES.length-1;else if(cur.step===0)cur.step="xero";else if(cur.step!=="xero")cur.step--;return top()}
  if(a==="showmiss"||(a==="next"&&!pageDone(cur.i,cur.step))){showMissing();return}
  if(a==="next"){editing=null;
    if(cur.step===PAGES.length-1){const f={...(prog(cur.i).f||{})};f.c44={v:today(),by:"auto",at:today()};await save(cur.i,{done:true,f});cur.step="done"}else cur.step++;return top()}
  if(a==="excel")excel();
}
function excel(){
  if(typeof XLSX==="undefined"){toast("Download isn't available. Refresh and try again.");return}
  const rows=[H.slice()];
  DATA.progs.forEach((p,i)=>rows.push(rowFor(i)));
  const log=[["Program","Field","Workbook value","Amanda's answer","Date"]];
  DATA.progs.forEach((p,i)=>Object.entries(prog(i).f||{}).forEach(([k,x])=>{if(k!=="c44")log.push([p.name,H[+k.slice(1)],x.was||"",x.v,x.at])}));
  const cm=[["Program","Page","Comment"]];const PN={x:"Step 1 · Xero product"};PAGES.forEach((p,k)=>PN[k]=p[0]);
  DATA.progs.forEach((p,i)=>Object.entries(prog(i).com||{}).forEach(([k,v])=>{if(v)cm.push([p.name,PN[k]||k,v])}));
  const b=XLSX.utils.book_new();XLSX.utils.book_append_sheet(b,XLSX.utils.aoa_to_sheet(cm),"Comments");XLSX.utils.book_append_sheet(b,XLSX.utils.aoa_to_sheet(rows),"School Holidays (Agents)");XLSX.utils.book_append_sheet(b,XLSX.utils.aoa_to_sheet(log),"Amanda's Answers");
  XLSX.writeFile(b,`Agents and PVTs School Holidays ${today()}.xlsx`);toast("Downloaded");
}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches||document.getElementById("confetti"))return;const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=COLORS.map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*13,vy:-Math.random()*11-3,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*9)],a:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.33;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++t<140)requestAnimationFrame(f);else c.remove()})()}
boot();
